name: Canonical unsigned packages

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact frozen 40-character source commit
        required: true
        type: string
      source_tree:
        description: Exact frozen 40-character source tree
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: One clean Arch build
    outputs:
      artifact_name: ${{ steps.provenance.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      build_metadata_sha256: ${{ steps.provenance.outputs.build_metadata_sha256 }}
      unsigned_manifest_sha256: ${{ steps.provenance.outputs.unsigned_manifest_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: archlinux:base-devel@sha256:714acd1eef9ae997d95691b1c5220ada0076185b77857c1813f02de0fa83cf7b
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            bash coreutils curl dconf git glib2 glib2-devel gnupg gsettings-desktop-schemas jq libarchive \
            python sassc shellcheck unzip zstd

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}

      - name: Require exact frozen source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          canonical_source=/opt/arch-linux-canonical
          [[ "${SOURCE_COMMIT}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${SOURCE_TREE}" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -c safe.directory="${GITHUB_WORKSPACE}" -C "${GITHUB_WORKSPACE}" rev-parse --verify 'HEAD^{commit}')" = "${SOURCE_COMMIT}"
          test "$(git -c safe.directory="${GITHUB_WORKSPACE}" -C "${GITHUB_WORKSPACE}" rev-parse --verify 'HEAD^{tree}')" = "${SOURCE_TREE}"
          test -z "$(git -c safe.directory="${GITHUB_WORKSPACE}" -C "${GITHUB_WORKSPACE}" status --porcelain=v1 --untracked-files=all)"
          test -d /opt
          test ! -L /opt
          test ! -e "${canonical_source}"
          test ! -L "${canonical_source}"
          git clone --no-local --no-hardlinks --no-checkout -- \
            "${GITHUB_WORKSPACE}" "${canonical_source}"
          git -C "${canonical_source}" checkout --detach "${SOURCE_COMMIT}"
          git -C "${canonical_source}" remote remove origin
          test "$(git -C "${canonical_source}" rev-parse --verify 'HEAD^{commit}')" = \
            "${SOURCE_COMMIT}"
          test "$(git -C "${canonical_source}" rev-parse --verify 'HEAD^{tree}')" = \
            "${SOURCE_TREE}"
          test -z "$(git -C "${canonical_source}" \
            status --porcelain=v1 --untracked-files=all)"
          test ! -e "${canonical_source}/.git/objects/info/alternates"
          test ! -L "${canonical_source}/.git/objects/info/alternates"
          test -z "$(find "${canonical_source}" -type f -links +1 -print -quit)"
          chown -R root:root -- "${canonical_source}"
          chmod -R go-w -- "${canonical_source}"
          test -z "$(find "${canonical_source}" \
            \( ! -user root -o ! -group root \) -print -quit)"
          test -z "$(find "${canonical_source}" -perm /022 -print -quit)"

      - name: Validate source before package execution
        working-directory: /opt/arch-linux-canonical
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          canonical_source=/opt/arch-linux-canonical
          useradd --create-home --shell /bin/bash package-builder
          workspace_parent="$(dirname -- "${GITHUB_WORKSPACE}")"
          source_parent="${workspace_parent}/arch-linux-source-validation"
          source_temp="${workspace_parent}/arch-linux-source-temp"
          test "$(stat --file-system --format=%t -- "${workspace_parent}")" = ef53
          test -f /.dockerenv
          test ! -L /.dockerenv
          [[ "${SOURCE_COMMIT}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${SOURCE_TREE}" =~ ^[a-f0-9]{40}$ ]]
          test ! -e "${source_parent}"
          test ! -L "${source_parent}"
          test ! -e "${source_temp}"
          test ! -L "${source_temp}"
          install -d -m0700 -o package-builder -g package-builder -- \
            "${source_parent}" "${source_temp}"
          test "$(stat --file-system --format=%t -- "${source_parent}")" = ef53
          test "$(stat --file-system --format=%t -- "${source_temp}")" = ef53
          builder_home="$(getent passwd package-builder | cut -d: -f6)"
          test -n "${builder_home}"
          test "$(git -C "${canonical_source}" rev-parse --verify 'HEAD^{commit}')" = \
            "${SOURCE_COMMIT}"
          test "$(git -C "${canonical_source}" rev-parse --verify 'HEAD^{tree}')" = \
            "${SOURCE_TREE}"
          test -z "$(git -C "${canonical_source}" \
            status --porcelain=v1 --untracked-files=all)"
          test -z "$(find "${canonical_source}" \
            \( ! -user root -o ! -group root \) -print -quit)"
          test -z "$(find "${canonical_source}" -perm /022 -print -quit)"
          current="${canonical_source}"
          while :; do
            test ! -L "${current}"
            if runuser -u package-builder -- test -w "${current}"; then
              printf 'package builder can replace canonical source through writable path: %s\n' \
                "${current}" >&2
              exit 1
            fi
            test "${current}" = / && break
            current="$(dirname -- "${current}")"
          done
          writable_path="$(runuser -u package-builder -- \
            find "${canonical_source}" -writable -print -quit)"
          if test -n "${writable_path}"; then
            printf 'package builder can write canonical source\n' >&2
            exit 1
          fi
          test ! -e "${builder_home}/.gitconfig"
          test ! -L "${builder_home}/.gitconfig"
          runuser -u package-builder -- env -i \
            HOME="${builder_home}" USER=package-builder LOGNAME=package-builder \
            LANG=C LC_ALL=C PATH=/usr/local/bin:/usr/bin:/bin \
            git config --global --add safe.directory "${canonical_source}"
          runuser -u package-builder -- env -i \
            HOME="${builder_home}" USER=package-builder LOGNAME=package-builder \
            LANG=C LC_ALL=C PATH=/usr/local/bin:/usr/bin:/bin \
            git config --global --add safe.directory "${canonical_source}/.git"
          runuser -u package-builder -- env -i \
            HOME="${builder_home}" USER=package-builder LOGNAME=package-builder \
            LANG=C LC_ALL=C PATH=/usr/local/bin:/usr/bin:/bin \
            git clone --no-local --no-hardlinks \
            --no-checkout -- "${canonical_source}" "${source_parent}/repo"
          rm -f -- "${builder_home}/.gitconfig"
          test ! -e "${builder_home}/.gitconfig"
          test ! -L "${builder_home}/.gitconfig"
          runuser -u package-builder -- env -i \
            HOME="${builder_home}" USER=package-builder LOGNAME=package-builder \
            LANG=C LC_ALL=C PATH=/usr/local/bin:/usr/bin:/bin \
            git -C "${source_parent}/repo" checkout --detach "${SOURCE_COMMIT}"
          test "$(runuser -u package-builder -- env -i \
            HOME="${builder_home}" USER=package-builder LOGNAME=package-builder \
            LANG=C LC_ALL=C PATH=/usr/local/bin:/usr/bin:/bin \
            git -C "${source_parent}/repo" rev-parse --verify 'HEAD^{commit}')" = \
            "${SOURCE_COMMIT}"
          test "$(runuser -u package-builder -- env -i \
            HOME="${builder_home}" USER=package-builder LOGNAME=package-builder \
            LANG=C LC_ALL=C PATH=/usr/local/bin:/usr/bin:/bin \
            git -C "${source_parent}/repo" rev-parse --verify 'HEAD^{tree}')" = \
            "${SOURCE_TREE}"
          test -z "$(runuser -u package-builder -- env -i \
            HOME="${builder_home}" USER=package-builder LOGNAME=package-builder \
            LANG=C LC_ALL=C PATH=/usr/local/bin:/usr/bin:/bin \
            git -C "${source_parent}/repo" status --porcelain=v1 --untracked-files=all)"
          runuser -u package-builder -- test ! -e \
            "${source_parent}/repo/.git/objects/info/alternates"
          runuser -u package-builder -- test ! -L \
            "${source_parent}/repo/.git/objects/info/alternates"
          test -z "$(runuser -u package-builder -- \
            find "${source_parent}/repo" -type f -links +1 -print -quit)"
          runuser -u package-builder -- env -i \
            HOME="${builder_home}" USER=package-builder LOGNAME=package-builder \
            LANG=C LC_ALL=C PATH=/usr/local/bin:/usr/bin:/bin \
            CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            ARCH_LINUX_ALLOW_HOSTED_NAMESPACE_DEFERRAL=github-hosted-container-v1 \
            RUNNER_TEMP="${source_temp}" \
            bash "${source_parent}/repo/tests/source-tests.sh"
          test -z "$(runuser -u package-builder -- env -i \
            HOME="${builder_home}" USER=package-builder LOGNAME=package-builder \
            LANG=C LC_ALL=C PATH=/usr/local/bin:/usr/bin:/bin \
            git -C "${source_parent}/repo" status --porcelain=v1 --untracked-files=all)"
          test "$(git -C "${canonical_source}" rev-parse --verify 'HEAD^{commit}')" = \
            "${SOURCE_COMMIT}"
          test "$(git -C "${canonical_source}" rev-parse --verify 'HEAD^{tree}')" = \
            "${SOURCE_TREE}"
          test -z "$(git -C "${canonical_source}" \
            status --porcelain=v1 --untracked-files=all)"
          test -z "$(runuser -u package-builder -- \
            find "${canonical_source}" -writable -print -quit)"
          test ! -e "${builder_home}/.gitconfig"
          test ! -L "${builder_home}/.gitconfig"

      - name: Build as a temporary unprivileged user
        working-directory: /opt/arch-linux-canonical
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          canonical_source=/opt/arch-linux-canonical
          install -d -m0755 -o package-builder -g package-builder /tmp/arch-linux-build
          builder_home="$(getent passwd package-builder | cut -d: -f6)"
          test -n "${builder_home}"
          check_canonical_source() {
            local current writable_path
            test "$(git -C "${canonical_source}" rev-parse --verify 'HEAD^{commit}')" = \
              "${SOURCE_COMMIT}"
            test "$(git -C "${canonical_source}" rev-parse --verify 'HEAD^{tree}')" = \
              "${SOURCE_TREE}"
            test -z "$(git -C "${canonical_source}" \
              status --porcelain=v1 --untracked-files=all)"
            test ! -e "${canonical_source}/.git/objects/info/alternates"
            test ! -L "${canonical_source}/.git/objects/info/alternates"
            test -z "$(find "${canonical_source}" -type f -links +1 -print -quit)"
            test -z "$(find "${canonical_source}" \
              \( ! -user root -o ! -group root \) -print -quit)"
            test -z "$(find "${canonical_source}" -perm /022 -print -quit)"
            current="${canonical_source}"
            while :; do
              test ! -L "${current}"
              if runuser -u package-builder -- test -w "${current}"; then
                printf 'package builder can replace canonical source: %s\n' \
                  "${current}" >&2
                return 1
              fi
              test "${current}" = / && break
              current="$(dirname -- "${current}")"
            done
            writable_path="$(runuser -u package-builder -- \
              find "${canonical_source}" -writable -print -quit)"
            test -z "${writable_path}"
          }
          check_canonical_source
          test ! -e "${builder_home}/.gitconfig"
          test ! -L "${builder_home}/.gitconfig"
          runuser -u package-builder -- env -i \
            HOME="${builder_home}" USER=package-builder LOGNAME=package-builder \
            LANG=C.UTF-8 LC_ALL=C PATH=/usr/local/bin:/usr/bin:/bin \
            RUNNER_TEMP=/tmp/arch-linux-build \
            bash "${canonical_source}/repository/build-packages.sh" \
            /tmp/arch-linux-build/canonical-unsigned
          check_canonical_source
          test ! -e "${builder_home}/.gitconfig"
          test ! -L "${builder_home}/.gitconfig"
          PACKAGE_ARTIFACT_DIR=/tmp/arch-linux-build/canonical-unsigned \
            bash "${canonical_source}/tests/package-checks.sh"
          check_canonical_source

      - name: Record canonical provenance
        working-directory: /opt/arch-linux-canonical
        id: provenance
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          build_metadata_sha256="$(sha256sum --binary -- \
            /tmp/arch-linux-build/canonical-unsigned/BUILD-METADATA.json)"
          unsigned_manifest_sha256="$(sha256sum --binary -- \
            /tmp/arch-linux-build/canonical-unsigned/UNSIGNED-SHA256SUMS)"
          artifact_name="arch-linux-canonical-unsigned-${SOURCE_COMMIT}"
          {
            printf 'artifact_name=%s\n' "${artifact_name}"
            printf 'build_metadata_sha256=%s\n' "${build_metadata_sha256%% *}"
            printf 'unsigned_manifest_sha256=%s\n' "${unsigned_manifest_sha256%% *}"
          } >>"${GITHUB_OUTPUT}"
          # shellcheck disable=SC2016
          printf 'Canonical artifact: `%s`\n\nBUILD-METADATA SHA-256: `%s`\n\nUNSIGNED manifest SHA-256: `%s`\n' \
            "${artifact_name}" "${build_metadata_sha256%% *}" "${unsigned_manifest_sha256%% *}" \
            >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload canonical unsigned artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: ${{ steps.provenance.outputs.artifact_name }}
          path: /tmp/arch-linux-build/canonical-unsigned
          if-no-files-found: error
          retention-days: 14

  readback:
    name: Read back canonical artifact
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel@sha256:714acd1eef9ae997d95691b1c5220ada0076185b77857c1813f02de0fa83cf7b
    steps:
      - name: Install verifier dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed bash coreutils git gnupg libarchive python

      - name: Check out exact verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}

      - name: Download run-scoped artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5.0.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/canonical-readback

      - name: Verify readback identity and bytes
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          BUILD_METADATA_SHA256: ${{ needs.build.outputs.build_metadata_sha256 }}
          UNSIGNED_MANIFEST_SHA256: ${{ needs.build.outputs.unsigned_manifest_sha256 }}
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="${GITHUB_WORKSPACE}" -C "${GITHUB_WORKSPACE}" rev-parse --verify 'HEAD^{commit}')" = "${SOURCE_COMMIT}"
          test "$(git -c safe.directory="${GITHUB_WORKSPACE}" -C "${GITHUB_WORKSPACE}" rev-parse --verify 'HEAD^{tree}')" = "${SOURCE_TREE}"
          test -z "$(git -c safe.directory="${GITHUB_WORKSPACE}" -C "${GITHUB_WORKSPACE}" status --porcelain=v1 --untracked-files=all)"
          printf '%s *%s\n' "${BUILD_METADATA_SHA256}" \
            "${RUNNER_TEMP}/canonical-readback/BUILD-METADATA.json" | sha256sum --check --strict
          printf '%s *%s\n' "${UNSIGNED_MANIFEST_SHA256}" \
            "${RUNNER_TEMP}/canonical-readback/UNSIGNED-SHA256SUMS" | sha256sum --check --strict
          PACKAGE_ARTIFACT_DIR="${RUNNER_TEMP}/canonical-readback" bash tests/package-checks.sh
