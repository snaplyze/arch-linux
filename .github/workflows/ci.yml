name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install check dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates curl dconf-cli gnupg libarchive-tools xz-utils zstd
          shellcheck_version=0.11.0
          shellcheck_archive="shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          shellcheck_sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          shellcheck_download="${RUNNER_TEMP}/${shellcheck_archive}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "${shellcheck_download}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/${shellcheck_archive}"
          printf '%s *%s\n' "${shellcheck_sha256}" "${shellcheck_download}" |
            sha256sum --check --strict
          tar --extract --xz --file "${shellcheck_download}" --directory "${RUNNER_TEMP}"
          sudo install -m0755 -o root -g root -- \
            "${RUNNER_TEMP}/shellcheck-v${shellcheck_version}/shellcheck" \
            /usr/local/bin/shellcheck
          test "$(command -v shellcheck)" = /usr/local/bin/shellcheck
          test "$(shellcheck --version | awk '$1 == "version:" { print $2 }')" = \
            "${shellcheck_version}"

      - name: Run required source checks
        run: |
          set -euo pipefail
          bash tests/source-tests.sh

      - name: Check whitespace
        run: |
          set -euo pipefail
          git diff --check
