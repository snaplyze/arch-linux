name: Bug report
description: Report a reproducible installer, package or repository defect.
title: 'fix: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include passwords, tokens, private keys, unredacted logs or sensitive disk metadata.
        Report security issues through private vulnerability reporting.
  - type: input
    id: release
    attributes:
      label: Release
      description: Exact immutable release tag used.
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Installation profile
      options:
        - Minimal TTY
        - Stock GNOME
        - Marble desktop
        - Marble desktop with experimental GDM
        - Package repository only
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Arch ISO, firmware mode, filesystem, encryption, VM or hardware, and relevant package versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Smallest exact sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Relevant messages, checksums or screenshots with secrets and identifying data removed.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I verified that this report contains no secrets or sensitive disk/account data.
          required: true
